<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/vues-projets.css">
    <link rel="shortcut icon" href="assets/favicon.png" />
    <title>EpokaPresse</title>
</head>
<body>
    <div id="navbar"></div>
    <div class="layout bdd">
        <h1>Evolution de la base de données</h1>
        <div class="content">
            <div class="image">
                <img src="assets/epokaPresse/BDD.png" alt="">
            </div>
            <p>Tout d'abord, nous avons dû mettre en place une nouvelle base de données afin de répondre aux différents besoins de l'entreprise.</p>
        </div>
    </div>
    <div class="layout site">
        <h1>Création du l'application Web</h1>
        <section class="container">
            <div class="slider-wrapper">
                <div class="slider">
                    <img id="slide-1" src="assets/epokaPresse/accueil.png" alt="page de l'application EpokaPresse">
                    <img id="slide-2" src="assets/epokaPresse/ajout_vente.png" alt="page d'ajout des ventes de l'application EpokaPresse">
                </div>
                <div class="slider-nav">
                    <a href="#slide-1"></a>
                    <a href="#slide-2"></a>
                </div>
            </div>
            <p>Enfin, nous avons mis en place l'application Web.</p>
        </section>
    </div>
    <div id="footer"></div>
    <script src="components-loader.js"></script>
</body>
</html>
